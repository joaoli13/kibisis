<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="kibisis">
  <title>kibisis — pouch mark + wordmark</title>

  <!-- pouch mark -->
  <g transform="translate(20, 30)">
    <path d="M 60 50
             Q 60 35 75 35
             L 125 35
             Q 140 35 140 50
             L 140 60
             Q 175 80 175 130
             Q 175 175 100 175
             Q 25 175 25 130
             Q 25 80 60 60
             Z"
          fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
    <line x1="68" y1="50" x2="132" y2="50" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <g fill="#c4593b">
      <circle cx="65" cy="125" r="10"/>
      <circle cx="100" cy="125" r="10"/>
      <circle cx="135" cy="125" r="10"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="235" y1="55" x2="235" y2="175" stroke="#1a1a1a" stroke-width="1.5" opacity="0.25"/>

  <!-- wordmark -->
  <g transform="translate(260, 20)">
    <g stroke="#1a1a1a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="40" y1="30" x2="40" y2="155"/>
      <line x1="46" y1="118" x2="92" y2="82"/>
      <line x1="46" y1="118" x2="96" y2="155"/>

      <line x1="120" y1="78" x2="120" y2="155"/>

      <line x1="160" y1="30" x2="160" y2="155"/>
      <path d="M 160 92 C 220 88, 222 158, 160 155"/>

      <line x1="246" y1="78" x2="246" y2="155"/>

      <path d="M 318 90
               C 268 86, 268 118, 295 118
               C 322 118, 322 158, 272 155"/>

      <line x1="348" y1="78" x2="348" y2="155"/>

      <path d="M 420 90
               C 370 86, 370 118, 397 118
               C 424 118, 424 158, 374 155"/>
    </g>

    <g fill="#c4593b">
      <circle cx="120" cy="52" r="9"/>
      <circle cx="246" cy="52" r="9"/>
      <circle cx="348" cy="52" r="9"/>
    </g>
  </g>
</svg>
