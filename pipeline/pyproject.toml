[project]
name = "perseus-pipeline"
version = "0.1.0"
description = "Perseus MVP corpus pipeline M0-M5"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "google-generativeai>=0.8.0",
  "hdbscan>=0.8.40",
  "lxml>=5.0.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "umap-learn>=0.5.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

